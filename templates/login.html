<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Studio — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0907;
      --bg-raised: #18120e;
      --line: #38271e;
      --ink: #fef3c7;
      --ink-dim: #d1b99f;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.35);
      --accent-red: #ef4444;
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Plus Jakarta Sans", -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* ── Full-screen background image ── */
    .bg-image {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url("{{ url_for('static', filename='assets/studio.png') }}") center/cover no-repeat;
      /* Fallback gradient if image fails */
      background-color: #0d0907;
    }

    /* ── Dark gradient overlay so the card reads clearly ── */
    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: linear-gradient(
        90deg,
        rgba(13, 9, 7, 0.92) 0%,
        rgba(13, 9, 7, 0.75) 40%,
        rgba(13, 9, 7, 0.35) 70%,
        rgba(13, 9, 7, 0.15) 100%
      );
      pointer-events: none;
    }

    /* ── Layout: form pinned to the left, image visible on the right ── */
    .login-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1400px;
      padding: 24px 40px;
      display: flex;
      justify-content: flex-start;   /* form on the left → image shows on the right */
      align-items: center;
      min-height: 100vh;
    }

    /* ── Glass card ── */
    .login-card {
      width: 100%;
      max-width: 420px;
      background: rgba(24, 18, 14, 0.88);
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 40px 36px 36px;
      box-shadow:
        0 30px 70px -15px rgba(0, 0, 0, 0.85),
        0 0 0 1px rgba(245, 158, 11, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    /* ── Brand header ── */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .brand-dot {
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent);
      flex: none;
    }
    .brand-text {
      font-family: "Outfit", sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--ink);
    }
    .brand-sub {
      font-size: 12px;
      color: var(--ink-dim);
      margin-top: 2px;
      letter-spacing: 0.02em;
    }

    h1 {
      font-family: "Outfit", sans-serif;
      font-weight: 800;
      font-size: 26px;
      margin: 0 0 6px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .subtitle {
      color: var(--ink-dim);
      font-size: 14px;
      margin: 0 0 28px;
      line-height: 1.5;
    }

    /* ── Form ── */
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-dim);
      margin-bottom: 6px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      background: rgba(13, 9, 7, 0.7);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      font-size: 14.5px;
      font-family: inherit;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
    }
    input::placeholder {
      color: #6b5a4a;
    }

    /* ── Error / success message ── */
    .msg {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      margin-bottom: 18px;
      display: none;
    }
    .msg.error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      display: block;
    }
    .msg.success {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
      display: block;
    }

    /* ── Submit button ── */
    .btn-login {
      width: 100%;
      padding: 13px 20px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #1a0f0a;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px var(--accent-glow);
      letter-spacing: 0.02em;
      margin-top: 4px;
    }
    .btn-login:hover:not(:disabled) {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(245, 158, 11, 0.45);
    }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Footer note ── */
    .login-footer {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 12.5px;
      color: var(--ink-dim);
      text-align: center;
      line-height: 1.5;
    }
    .login-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .login-footer a:hover {
      text-decoration: underline;
    }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      .login-wrapper {
        justify-content: center;
        padding: 20px 16px;
      }
      .login-card {
        max-width: 100%;
        padding: 30px 22px 28px;
      }
      .bg-overlay {
        background: rgba(13, 9, 7, 0.82);
      }
    }
  </style>
</head>
<body>

  <!-- Background image + overlay -->
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>

  <!-- Login form pinned left, studio image visible on the right -->
  <div class="login-wrapper">
    <div class="login-card">
      <div class="brand">
        <span class="brand-dot"></span>
        <div>
          <div class="brand-text">🎸 Music Studio</div>
          <div class="brand-sub">Local AI Audio Toolset</div>
        </div>
      </div>

      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to access your studio workspace.</p>

      <div id="msg" class="msg"></div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
      </form>

      <div class="login-footer">
        Access is by invitation only.<br>
        Contact the admin for an account.
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const msgEl = document.getElementById('msg');
    const btn = document.getElementById('loginBtn');

    function showMsg(text, type) {
      msgEl.textContent = text;
      msgEl.className = 'msg ' + type;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showMsg('Please fill in both fields.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in…';
      msgEl.className = 'msg';

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (data.ok) {
          showMsg('Login successful. Redirecting…', 'success');
          setTimeout(() => {
            window.location.href = data.redirect || '/dashboard';
          }, 600);
        } else {
          showMsg(data.error || 'Invalid username or password.', 'error');
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      } catch (err) {
        showMsg('Network error. Please try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>

</body>
</html>
